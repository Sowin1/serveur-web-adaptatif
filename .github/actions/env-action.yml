name: 'Env file'
description: 'Creating env file'
inputs:
  AUTH_BATTERY_PASS:
      description: 'AUTH_BATTERY_PASS'
      required: false
      default: 'AUTH_BATTERY_PASS'

  ENODE_CLIENT_SECRET:
    description: 'ENODE_CLIENT_SECRET'
    required: false
    default: 'ENODE_CLIENT_SECRET'

  JWT_SECRET:
    description: 'JWT_SECRET'
    required: false
    default: 'JWT_SECRET'

  AUTH_BATTERY:
    description: 'AUTH_BATTERY'
    required: false
    default: 'AUTH_BATTERY'

  ENODE_CLIENT_ID:
    description: 'ENODE_CLIENT_ID'
    required: false
    default: 'ENODE_CLIENT_ID'

  ENODE_TOKEN_URL:
    description: 'ENODE_TOKEN_URL'
    required: false
    default: 'ENODE_TOKEN_URL'

  ENODE_URL:
    description: 'ENODE_TOKEN_URL'
    required: false
    default: 'ENODE_URL'

runs:
  using: "composite"
  steps:
    - name: Initialize env file
      run: |
        echo "ENODE_URL=${{ inputs.ENODE_URL }}" >> .env
        echo "ENODE_TOKEN_URL=${{ inputs.ENODE_TOKEN_URL }}" >> .env
        echo "ENODE_CLIENT_ID=${{ inputs.ENODE_CLIENT_ID }}" >> .env
        echo "AUTH_BATTERY=${{ inputs.AUTH_BATTERY }}" >> .env
        echo "AUTH_BATTERY_PASS=${{ inputs.AUTH_BATTERY_PASS }}" >> .env
        echo "ENODE_CLIENT_SECRET=${{ inputs.ENODE_CLIENT_SECRET }}" >> .env
        echo "JWT_SECRET=${{ inputs.JWT_SECRET }}" >> .env  

