name: CI Backend

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

jobs:
  code-verification:
    name: Code verification
    runs-on: self-hosted

    container:
      image: node:24-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm & install
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: Lint verification
        run: pnpm --filter backend lint

      - name: Format check
        run: pnpm --filter backend format:check

      - name: Type check
        run: pnpm --filter backend typecheck

  unit-test:
    name: Unit & E2E tests
    needs: code-verification
    runs-on: self-hosted

    container:
      image: node:24-alpine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm & install
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: Unit test
        run: pnpm --filter backend test

      - name: End 2 End test
        run: pnpm --filter backend test:e2e