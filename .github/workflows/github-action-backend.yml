name: CI Backend

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - '.github/workflows/github-action-backend.yml'
      - 'backend/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

  push:
    branches:
      - main

jobs:
  code-verification:
    name: Code verification
    runs-on: self-hosted
    container:
      image: node:24-bookworm-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm & install
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: Lint verification
        run: pnpm --filter backend lint

      - name: Format check
        run: pnpm --filter backend format:check

      - name: Type check
        run: pnpm --filter backend typecheck

      - name: Cleanup workspace
        if: always()
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

  unit-test:
    name: Unit & E2E tests
    environment: test
    needs: code-verification
    runs-on: self-hosted

    container:
      image: node:24-bookworm-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Setup pnpm & install
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: End 2 End test
        env:
          ENODE_URL: ${{ vars.ENODE_URL }}
          ENODE_TOKEN_URL: ${{ vars.ENODE_TOKEN_URL }}
          ENODE_CLIENT_ID: ${{ vars.ENODE_CLIENT_ID }}
          AUTH_BATTERY: ${{ vars.AUTH_BATTERY }}
          AUTH_BATTERY_PASS: ${{ secrets.AUTH_BATTERY_PASS }}
          ENODE_CLIENT_SECRET: ${{ secrets.ENODE_CLIENT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: pnpm --filter backend test:e2e
      
      - name: Cleanup workspace
        if: always()
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +

  build-backend:
    needs: unit-test
    runs-on: self-hosted
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    defaults:
      run:
        shell: sh
    container:
      image: node:24-bookworm-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup pnpm & install
        run: |
          corepack enable
          corepack prepare pnpm@12.6.0 --activate
          pnpm install --frozen-lockfile --prefer-offline

      - name: Build backend
        run: |
          pnpm build:backend
          cp backend/package.json backend/dist/

      - name: Save backend build
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: backend/dist/
          if-no-files-found: error

      - name: Cleanup workspace
        if: always()
        run: |
          find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
